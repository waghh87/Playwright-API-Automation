<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Allure Report Snapshot</title>
  <style>
    body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; margin: 0; }
    header { padding: 16px; background: #222; color: #fff; }
    .container { padding: 16px; }
    iframe { width: 100%; height: calc(100vh - 120px); border: 1px solid #ddd; }
    .note { color: #333; margin-bottom: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>Allure Report Snapshot</h1>
  </header>
  <div class="container">
    <p class="note">This is an embedded snapshot of the generated Allure report. To view a live report locally, generate the report and open <code>allure-report/index.html</code>.</p>
    <iframe src="allure-report/index.html" title="Allure Report"></iframe>
  </div>
</body>
</html>
